[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tonnetz-gnn"
version = "0.1.0"
description = "Tonnetz-based graph neural networks for chord prediction and explainability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]
